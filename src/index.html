<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Pokémon Team Builder</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Monte times de até 6 Pokémon da geração 1 e veja na hora as forças e fraquezas do time."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <script>
      // Aplica o tema antes do primeiro paint para não piscar.
      (function () {
        try {
          var stored = localStorage.getItem('ptb.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
          /* localStorage indisponível: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
