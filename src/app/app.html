<a
  appButton
  variant="outline"
  class="sr-only absolute left-4 top-4 z-50 focus:not-sr-only"
  href="#conteudo"
>
  Pular para o conteúdo
</a>

<header class="sticky top-0 z-30 border-b border-border bg-background/85 backdrop-blur">
  <div class="mx-auto flex h-14 max-w-7xl items-center gap-2 px-4">
    <a
      routerLink="/pokedex"
      class="mr-2 flex items-center gap-2 rounded-md font-semibold tracking-tight"
      aria-label="Pokémon Team Builder — início"
    >
      <app-icon name="ball" [size]="20" class="text-foreground" />
      <span class="hidden sm:inline">Team Builder</span>
    </a>

    <nav class="flex items-center gap-1" aria-label="Navegação principal">
      <a
        appButton
        variant="ghost"
        size="sm"
        routerLink="/pokedex"
        routerLinkActive="bg-accent text-accent-foreground"
        ariaCurrentWhenActive="page"
      >
        Pokédex
      </a>
      <a
        appButton
        variant="ghost"
        size="sm"
        routerLink="/team"
        routerLinkActive="bg-accent text-accent-foreground"
        ariaCurrentWhenActive="page"
      >
        Meu time
      </a>
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <a
        appButton
        variant="outline"
        size="sm"
        routerLink="/team"
        class="font-mono tabular-nums"
        [attr.aria-label]="'Time atual: ' + team.size() + ' de ' + maxTeamSize + ' Pokémon'"
      >
        <app-icon name="users" [size]="14" />
        {{ team.size() }}/{{ maxTeamSize }}
      </a>

      <button
        appButton
        variant="ghost"
        size="icon"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
      >
        @if (theme() === 'dark') {
          <app-icon name="sun" [size]="18" />
        } @else {
          <app-icon name="moon" [size]="18" />
        }
      </button>
    </div>
  </div>
</header>

<main id="conteudo" class="mx-auto max-w-7xl px-4 py-6" tabindex="-1">
  <router-outlet />
</main>
